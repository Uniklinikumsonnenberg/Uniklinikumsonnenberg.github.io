<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personalverwaltung - Universitätsklinikum Sonnenberg</title>
    <!-- SortableJS für Drag & Drop Funktionalität -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        :root {
            --uks-blue-dark: #003865;
            --uks-blue-light: #6c99c6;
            --uks-gold: #fdb913;
            --bg-light: #f8f9fa;
            --white: #ffffff;
            --accent-red: #e74c3c;
            --falken-blue: #000e2b; /* Aus Dienstplan übernommen */
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg-light); 
            margin: 0; padding: 0; 
        }

        header {
            background-color: var(--white);
            padding: 20px;
            text-align: center;
        }

        .logo-container img {
            max-width: 250px;
            height: auto;
        }

        /* Navigationsleiste aus Dienstplan */
        .nav-bar {
            background-color: var(--uks-blue-dark);
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 10px 0 20px 0;
            border-bottom: 5px solid var(--uks-gold);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-btn {
            padding: 10px 20px;
            background-color: transparent;
            color: white;
            border: 2px solid var(--uks-gold);
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
            transition: 0.3s;
            font-size: 0.9em;
            text-transform: uppercase;
        }

        .nav-btn:hover, .nav-btn.active {
            background-color: var(--uks-gold);
            color: var(--uks-blue-dark);
        }

        .admin-section {
            background: #e9ecef;
            color: var(--uks-blue-dark);
            padding: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid #ddd;
        }

        .admin-section input[type="password"] {
            padding: 5px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        .status-badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: bold;
            background: #ddd;
        }

        .main-container {
            padding: 30px;
            max-width: 1400px;
            margin: 0 auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border-radius: 8px;
        }

        th {
            background-color: var(--uks-blue-dark);
            color: var(--uks-gold);
            padding: 15px;
            text-align: left;
            text-transform: uppercase;
            font-size: 0.85em;
            letter-spacing: 1px;
        }

        .category-row {
            background-color: #f1f1f1 !important;
            color: var(--uks-blue-dark);
            font-weight: bold;
            text-transform: uppercase;
        }

        .category-row td.cat-text {
            padding: 12px 20px;
            border-bottom: 2px solid var(--uks-gold);
            text-align: center;
            letter-spacing: 2px;
        }

        td {
            padding: 10px;
            border-bottom: 1px solid #eee;
        }

        .drag-handle {
            cursor: grab;
            margin-right: 10px;
            color: #ccc;
        }

        input[type="text"], select {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            width: 90%;
        }

        .multi-select-container { position: relative; width: 100%; }
        .multi-select-display { 
            background: #fff; border: 1px solid #ddd; padding: 8px; 
            border-radius: 4px; cursor: pointer; font-size: 0.9em; min-height: 35px;
        }
        .multi-select-dropdown { 
            display: none; position: absolute; z-index: 9999; background: white; 
            border: 1px solid var(--uks-blue-light); width: 100%; max-height: 200px; 
            overflow-y: auto; box-shadow: 0 8px 16px rgba(0,0,0,0.2); top: 100%;
        }

        .locked-input { pointer-events: none; opacity: 0.6; }
        .unlocked .locked-input { pointer-events: auto; opacity: 1; }

        .btn-add {
            background-color: var(--uks-blue-dark);
            color: white; border: none; padding: 10px 20px;
            border-radius: 4px; cursor: pointer; font-weight: bold;
        }
        
        .btn-delete { color: var(--accent-red); background: none; border: none; cursor: pointer; font-size: 1.2em; }
    </style>
</head>
<body>

<header>
    <div class="logo-container">
        <img src="https://r2.fivemanage.com/duNnRRRqkxrMPfikEWhQR/Bild_2026-05-04_224551624.png" alt="UKS Logo">
    </div>
</header>

<!-- Neue Navigationsleiste -->
<nav class="nav-bar">
    <a href="index.html" class="nav-btn">🏠 Intranet</a>
    <a href="medis.html" class="nav-btn">💊 Medikamente</a>
    <a href="wdb.html" class="nav-btn">📜 Leitlinien</a>
    <a href="dienstplan.html" class="nav-btn">📅 Dienstplan</a>
    <a href="personal.html" class="nav-btn active">👥 Personal</a>
</nav>

<div class="admin-section">
    <strong>Admin-Login:</strong>
    <input type="password" id="pw" placeholder="Passwort...">
    <button style="background-color: var(--uks-gold); color: var(--uks-blue-dark); border: none; padding: 5px 15px; border-radius: 4px; font-weight: bold; cursor: pointer;" onclick="unlock()">Freischalten</button>
    <span id="status" class="status-badge">🔴 Gesperrt</span>
</div>

<div class="main-container">
    <h2 style="color: var(--uks-blue-dark); border-left: 5px solid var(--uks-gold); padding-left: 15px;">Personalverwaltung</h2>
    
    <table id="sortableTable">
        <thead>
            <tr>
                <th style="width: 30%;">Vollständiger Name</th>
                <th style="width: 30%;">Position / Dienstgrad</th>
                <th style="width: 35%;">Fachbereiche</th>
                <th style="width: 5%;"></th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>

    <div style="margin-top: 20px; display: flex; gap: 10px;">
        <button class="btn-add locked-input" onclick="addRow()">+ Mitarbeiter</button>
        <button class="btn-add locked-input" onclick="addCategory()" style="background-color: var(--uks-blue-light);">+ Kategorie</button>
    </div>
</div>

<script>
    const rangStruktur = {
        "Klinikleitung": ["Ärztlicher Direktor", "Stellv. Ärztlicher Direktor", "Verwaltungsdirektion", "Stellv. Verwaltungsdirektion", "Pflegedirektion", "Stellv. Pflegedienstleitung"],
        "Ärztliches Personal": ["Chefarzt", "Ltd. Oberarzt", "Oberarzt", "Facharzt", "Assistenzarzt", "Medizinstudent"],
        "Pflegepersonal": ["Bereichsleitung ZNA", "Bereichsleitung OP", "Bereichsleitung ITS", "Bereichsleitung Stationspflege", "Bereichsleitung Ambulanzen", "Pflegefachkraft", "Pflegehelfer", "Praktikant"],
        "Nicht-Ärztlich": ["Psychotherapeut", "MTA für Radiologie", "MTA für Labor", "Physiotherapeut"],
        "Verwaltung": ["Verwaltungsmitarbeiter", "Empfangsdienst", "Hausmeister", "Reinigungskraft"]
    };

    const fachbereiche = ["Allgemeinmedizin", "Innere Medizin", "Chirurgie", "Unfallchirurgie und Orthopädie", "Neurologie und Psychiatrie", "Anästhesiologie und Intensivmed.", "Notfallmedizin", "Pädiatrie", "Palliativmedizin", "Pathologie", "HNO-Heilkunde", "Dermatologie", "Augenheilkunde", "Urologie", "Gynäkologie und Geburtshilfe", "Infektiologie und Immunologie", "Epidemiologie und Medizinethik", "Radiologie", "MKG- und Zahnmedizin", "Anästhesiepflege", "Intensivpflege", "Notfallpflege", "Stationspflege", "Wundmanagement"];

    const el = document.getElementById('tableBody');
    Sortable.create(el, {
        animation: 150,
        handle: '.drag-handle',
        onEnd: function() { saveAll(); }
    });

    function saveAll() {
        const rows = [];
        document.querySelectorAll('#tableBody tr').forEach(tr => {
            if (tr.classList.contains('category-row')) {
                rows.push({ type: 'category', text: tr.querySelector('.cat-text').innerText.replace('☰ ', '') });
            } else {
                const nameVal = tr.querySelector('input[type="text"]').value;
                const rangVal = tr.querySelector('select').value;
                const fachVal = tr.querySelector('.multi-select-display').innerText;
                rows.push({ type: 'staff', name: nameVal, rang: rangVal, fach: fachVal });
            }
        });
        localStorage.setItem('uks_data_final', JSON.stringify(rows));
    }

    function loadAll() {
        const data = JSON.parse(localStorage.getItem('uks_data_final'));
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        if (!data) {
            renderCategory("--- Klinikleitung ---");
            renderCategory("--- Ärztliches Personal ---");
        } else {
            data.forEach(item => {
                if (item.type === 'category') renderCategory(item.text);
                else renderStaffRow(item.name, item.rang, item.fach);
            });
        }
    }

    function unlock() {
        if(document.getElementById('pw').value === "admin123") {
            document.body.classList.add('unlocked');
            document.querySelectorAll('.locked-input').forEach(el => el.classList.remove('locked-input'));
            document.getElementById('status').innerText = "🟢 Schreibberechtigt";
            document.getElementById('status').style.background = "#27ae60";
            document.getElementById('status').style.color = "white";
        } else { alert("Passwort falsch!"); }
    }

    function renderStaffRow(name = "", selRang = "", selFach = "Wählen...") {
        const row = document.createElement('tr');
        let options = "";
        for (let k in rangStruktur) {
            options += `<optgroup label="${k}">`;
            rangStruktur[k].forEach(r => options += `<option ${r===selRang?'selected':''}>${r}</option>`);
            options += `</optgroup>`;
        }

        row.innerHTML = `
            <td><span class="drag-handle">☰</span><input type="text" class="locked-input" value="${name}" oninput="saveAll()"></td>
            <td><select class="locked-input" onchange="saveAll()">${options}</select></td>
            <td>
                <div class="multi-select-container locked-input">
                    <div class="multi-select-display" onclick="toggleDropdown(this)">${selFach}</div>
                    <div class="multi-select-dropdown">
                        ${fachbereiche.map(f => `
                            <label><input type="checkbox" value="${f}" ${selFach.includes(f)?'checked':''} 
                            onchange="updateDisplay(this); saveAll();"> ${f}</label>
                        `).join('')}
                    </div>
                </div>
            </td>
            <td><button class="btn-delete locked-input" onclick="this.parentElement.parentElement.remove(); saveAll();">✖</button></td>
        `;
        document.getElementById('tableBody').appendChild(row);
    }

    function renderCategory(name) {
        const row = document.createElement('tr');
        row.className = "category-row";
        row.innerHTML = `
            <td colspan="3" class="cat-text"><span class="drag-handle">☰</span> ${name}</td>
            <td class="cat-delete"><button class="btn-delete locked-input" onclick="this.parentElement.parentElement.remove(); saveAll();">✖</button></td>
        `;
        document.getElementById('tableBody').appendChild(row);
    }

    function addRow() { renderStaffRow(); saveAll(); }
    function addCategory() { const n = prompt("Kategorie:"); if(n) { renderCategory(n); saveAll(); } }
    
    function toggleDropdown(el) {
        const dropdown = el.nextElementSibling;
        dropdown.style.display = dropdown.style.display === 'block' ? 'none' : 'block';
    }
    
    function updateDisplay(cb) {
        const cont = cb.closest('.multi-select-container');
        const chk = Array.from(cont.querySelectorAll('input:checked')).map(c => c.value);
        cont.querySelector('.multi-select-display').innerText = chk.length > 0 ? chk.join(', ') : "Wählen...";
    }

    window.onclick = e => {
        if (!e.target.matches('.multi-select-display') && !e.target.closest('.multi-select-dropdown')) {
            document.querySelectorAll('.multi-select-dropdown').forEach(d => d.style.display = 'none');
        }
    }
    window.onload = loadAll;
</script>
</body>
</html>
